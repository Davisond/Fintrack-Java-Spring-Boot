server:
  port: 8081

spring:
  application:
    name: fintrack
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:fintrack}
    username: ${DB_USER:fintrack}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true